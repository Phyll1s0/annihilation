<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; overscroll-behavior: none; }
		#game { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
		#canvas { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
		#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #dce1e5; }
		.loader { width: min(74vw, 360px); text-align: center; }
		.orbit { width: 30px; height: 45px; margin: 0 auto 32px; border: 1px solid #75808c; border-radius: 50%; transform: rotate(25deg); animation: orbit 8s ease-in-out infinite; }
		h1 { font-size: clamp(18px, 4.7vw, 27px); font-weight: 200; letter-spacing: .06em; margin: 0 0 32px; }
		progress { display: block; width: 100%; height: 2px; border: 0; border-radius: 0; background: #20252b; accent-color: #a9b4bf; }
		progress::-webkit-progress-bar { background: #20252b; }
		progress::-webkit-progress-value { background: #a9b4bf; }
		progress::-moz-progress-bar { background: #a9b4bf; }
		#loading-label, #status-notice { font-size: 12px; line-height: 1.7; color: #8e99a5; margin-top: 16px; }
		#retry { margin-top: 18px; min-width: 100px; min-height: 44px; border: 1px solid #515a64; background: transparent; color: #dce1e5; cursor: pointer; }
		#rotate-hint { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center; color: #8e99a5; font-size: 11px; pointer-events: none; }
		[hidden] { display: none !important; }
		@keyframes orbit { 50% { transform: rotate(205deg); opacity: .45; } }
		@media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<div id="game"><canvas id="canvas" tabindex="0" aria-label="Annihilation puzzle game"></canvas></div>
	<noscript>Enable JavaScript to play ANNIHILATION.</noscript>
	<div id="status" role="status" aria-live="polite">
		<div class="loader">
			<div class="orbit" aria-hidden="true"></div>
			<h1>ANNIHILATION</h1>
			<progress id="status-progress" aria-label="Downloading game"></progress>
			<div id="loading-label">Loading</div>
			<div id="status-notice" hidden></div>
			<button id="retry" type="button" hidden>Retry</button>
		</div>
	</div>
	<div id="rotate-hint" hidden>Rotate your phone for a wider board</div>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// CSS owns the safe area; Godot alone resizes the drawing buffer (policy 1).
// Keep layout in CSS pixels, and bound GPU memory independently of screen DPR.
const canvas = document.getElementById('canvas');
const compatible = new URL(location.href).searchParams.get('render') === 'compat';
const phone = matchMedia('(pointer: coarse)').matches;
const viewport = window.annihilationViewport = { revision: 0 };
function commitViewport() {
	const rect = document.getElementById('game').getBoundingClientRect();
	const width = Math.max(1, Math.round(rect.width));
	const height = Math.max(1, Math.round(rect.height));
	const maxSide = phone ? 2048 : 4096;
	const maxPixels = phone ? 3000000 : 8000000;
	const ratio = Math.min(window.devicePixelRatio || 1, compatible ? 1 : phone ? 1.5 : 2,
		maxSide / width, maxSide / height, Math.sqrt(maxPixels / (width * height)));
	const renderWidth = Math.max(1, Math.floor(width * ratio));
	const renderHeight = Math.max(1, Math.floor(height * ratio));
	if (viewport.width === width && viewport.height === height &&
		viewport.renderWidth === renderWidth && viewport.renderHeight === renderHeight) return;
	Object.assign(viewport, { width, height, renderWidth, renderHeight, revision: viewport.revision + 1 });
}
let resizeTimer;
function queueViewport() {
	clearTimeout(resizeTimer);
	resizeTimer = setTimeout(commitViewport, 150);
}
new ResizeObserver(queueViewport).observe(document.getElementById('game'));
window.addEventListener('resize', queueViewport);
commitViewport();

// Called by Start's release gesture. Unsupported orientation APIs never block play.
window.annihilationPlay = async function () {
	if (!matchMedia('(pointer: coarse)').matches || innerWidth >= innerHeight) return;
	try {
		if (typeof screen.orientation?.lock !== 'function') throw new Error('Orientation lock unavailable');
		if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
			await document.documentElement.requestFullscreen();
		}
		await screen.orientation.lock('landscape');
	} catch (_) {
		const hint = document.getElementById('rotate-hint');
		if (innerWidth < innerHeight) {
			hint.hidden = false;
			setTimeout(() => { hint.hidden = true; }, 3500);
		}
	}
};
window.addEventListener('resize', () => { document.getElementById('rotate-hint').hidden = true; });

(function () {
	const overlay = document.getElementById('status');
	const progress = document.getElementById('status-progress');
	const label = document.getElementById('loading-label');
	const notice = document.getElementById('status-notice');
	const retry = document.getElementById('retry');
	let initializing = true;
	let failed = false;
	let graphicsLost = false;
	retry.addEventListener('click', () => {
		if (!graphicsLost || compatible) {
			location.reload();
			return;
		}
		const url = new URL(location.href);
		url.searchParams.set('render', 'compat');
		location.replace(url.href);
	});
	function fail(error) {
		if (!initializing) return;
		failed = true;
		initializing = false;
		progress.hidden = true;
		label.hidden = true;
		notice.textContent = 'Unable to load the game. Check your connection and try again.';
		notice.hidden = false;
		retry.hidden = false;
		console.error(error);
	}
	// Godot cannot rebuild its renderer after a lost context. Offer a full restart
	// with a smaller buffer, including when the loader has already been removed.
	canvas.addEventListener('webglcontextlost', event => {
		event.preventDefault();
		event.stopImmediatePropagation();
		failed = true;
		graphicsLost = true;
		initializing = false;
		progress.hidden = true;
		label.hidden = true;
		notice.textContent = 'The graphics session stopped. Reload with reduced graphics to continue.';
		notice.hidden = false;
		retry.textContent = compatible ? 'Reload game' : 'Reload with reduced graphics';
		retry.hidden = false;
		document.body.appendChild(overlay);
	}, true);
	window.addEventListener('unhandledrejection', event => fail(event.reason));
	if (typeof Engine === 'undefined') {
		fail(new Error('Unable to download the game runtime.'));
		return;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length) {
		fail(new Error(missing.join(', ')));
		notice.textContent = 'This browser cannot run the game. Please use a current browser with WebGL 2 and WebAssembly support.';
		return;
	}
	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			progress.value = current;
			progress.max = total;
			label.textContent = current >= total ? 'Starting' : `Loading ${Math.floor(current / total * 100)}%`;
		}
	}
	// A fresh HTML page must not start an older cached pack after a deployment.
	const pack = `${GODOT_CONFIG.executable}.pck`;
	const version = document.querySelector('meta[name="application-version"]')?.content || 'local';
	const packURL = `${pack}?build=${version}-${GODOT_CONFIG.fileSizes[pack]}`;
	GODOT_CONFIG.fileSizes[packURL] = GODOT_CONFIG.fileSizes[pack];
	const engine = new Engine({ ...GODOT_CONFIG, onProgress });
	Promise.all([
		engine.init(GODOT_CONFIG.executable),
		engine.preloadFile(packURL, pack),
	]).then(() => engine.start({ args: [
		'--resolution', `${viewport.renderWidth}x${viewport.renderHeight}`,
		'--main-pack', pack, ...GODOT_CONFIG.args,
	] })).then(() => {
		if (failed) return;
		initializing = false;
		overlay.remove();
	}, fail);
}());
	</script>
</body>
</html>
